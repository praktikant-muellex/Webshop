services:
  - type: web
    name: arbeitskleidung-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      # Was fromDatabase (Render's own free Postgres, arbeitskleidung-db) —
      # that plan auto-deletes 30 days after creation. Migrated to a Neon
      # Postgres project instead, which has no such expiry on its free tier.
      # Set manually in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Not set automatically — fill these in manually in the Render
      # dashboard after the first deploy. Missing RESEND_API_KEY/RECEIPT_*
      # just skips sending receipt emails (logged, non-fatal). Missing
      # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD is more serious: seedCatalog.ts
      # falls back to the well-known admin@muellex.com / changeme123
      # defaults from this public repo — set these before ever running
      # /internal/seed against a real database.
      - key: RESEND_API_KEY
        sync: false
      - key: RECEIPT_FROM_EMAIL
        sync: false
      - key: RECEIPT_TO_EMAIL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
