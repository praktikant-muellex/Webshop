services:
  - type: web
    name: arbeitskleidung-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arbeitskleidung-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false

  - type: cron
    name: arbeitskleidung-annual-grant
    runtime: node
    plan: free
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run grant:run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arbeitskleidung-db
          property: connectionString

databases:
  - name: arbeitskleidung-db
    plan: free
