services:
  - type: web
    name: arbeitskleidung-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arbeitskleidung-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: arbeitskleidung-db
    plan: free
