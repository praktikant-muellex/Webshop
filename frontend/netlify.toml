[build]
  command = "npm run build"
  publish = "dist"

# Proxies API calls through Netlify itself instead of the browser calling
# Render directly. That makes the session cookie first-party (same origin
# as the page), not cross-site — Safari's cross-site tracking prevention
# silently drops cross-site cookies even with SameSite=None; Secure set
# correctly, which broke login on iPhone while working fine everywhere
# else. Must come before the SPA catch-all below (first matching rule
# wins), or that one would swallow /api/* requests too.
[[redirects]]
  from = "/api/*"
  to = "https://arbeitskleidung-backend.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
