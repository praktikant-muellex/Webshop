name: Keep backend warm

# Render's free web-service plan spins the backend down after 15 minutes
# without a request, and the next request then pays a ~30-60s cold-start
# cost. Pinging it on a schedule during expected usage hours avoids that
# without ever letting the service run 24/7 (which would eat Render's
# 750 free instance-hours/month almost entirely on its own).
#
# Cron times are always UTC and GitHub Actions has no timezone/DST concept,
# so 4-16 (UTC) is a fixed window deliberately wide enough to cover
# 6:00-17:00 Austrian local time across both CET (UTC+1) and CEST (UTC+2).
# Weekdays only. Works out to ~13h x ~21.7 weekdays/month =~ 280h/month,
# well under the 750h free cap even before counting real user traffic.
on:
  schedule:
    - cron: "*/10 4-16 * * 1-5"
  workflow_dispatch: {}

# This job only ever does an unauthenticated GET against a public endpoint —
# it has no legitimate need for the default GITHUB_TOKEN's repo-write access.
# Declaring that explicitly means a future edit to this file that adds a step
# needing some permission has to opt into it on purpose, instead of silently
# inheriting whatever broad default the repo happens to have.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Requires RENDER_BACKEND_URL under Settings -> Secrets and variables
      # -> Actions -> Repository secrets (e.g. https://arbeitskleidung-backend.onrender.com,
      # no trailing slash). If it's added under an Environment instead, this
      # job can't see it — curl would then silently get an empty URL and
      # fail with the unhelpful "exit code 3", since this job doesn't
      # declare an `environment:`. The check below turns that into an
      # explicit, actionable annotation instead.
      - name: Check RENDER_BACKEND_URL is set
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "::error::RENDER_BACKEND_URL secret is missing or scoped to an Environment (needs to be a Repository secret)."
            exit 1
          fi
      - name: Ping backend health endpoint
        run: curl -sf "${{ secrets.RENDER_BACKEND_URL }}/health"
