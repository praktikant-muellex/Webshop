name: Annual budget grant

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# This job only ever does an authenticated POST against a fixed backend
# endpoint — it has no legitimate need for the default GITHUB_TOKEN's
# repo-write access. See the same reasoning in keep-warm.yml.
permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend grant endpoint
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "${{ secrets.RENDER_BACKEND_URL }}/internal/run-annual-grant" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.txt
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
